name: Suggest a topic or player
description: Propose a new lesson, market player, jurisdiction or milestone
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [Lesson, Player, Jurisdiction, Timeline milestone, Interactive tool]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should be covered and why? Include sources.
    validations:
      required: true
